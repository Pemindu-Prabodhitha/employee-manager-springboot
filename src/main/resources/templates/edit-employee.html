<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .error { color: red; font-size: 0.85rem; }
        input { margin-bottom: 4px; padding: 4px; }
    </style>
</head>
<body>
<h2>Edit Employee</h2>

<form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
    <input type="hidden" th:field="*{id}">
    <div>
        <input type="text" th:field="*{fullName}" placeholder="Full name">
        <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>
    <div>
        <input type="email" th:field="*{email}" placeholder="Email">
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>
    <div>
        <input type="text" th:field="*{phone}" placeholder="Phone (10 digits)">
        <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
    </div>
    <div>
        <input type="text" th:field="*{department}" placeholder="Department">
        <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
    </div>
    <div>
        <input type="number" step="0.01" th:field="*{salary}" placeholder="Salary">
        <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
    </div>
    <button type="submit">Update Employee</button>
    <a th:href="@{/employees}">Cancel</a>
</form>
</body>
</html>
