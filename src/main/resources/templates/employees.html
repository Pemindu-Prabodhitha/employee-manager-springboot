<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .error { color: red; font-size: 0.85rem; }
        .success { color: green; }
        input { margin-bottom: 4px; padding: 4px; }
    </style>
</head>
<body>
<h2>Employee Registration</h2>
<p class="success" th:if="${success}" th:text="${success}"></p>

<form th:action="@{/employees}" th:object="${employee}" method="post">
    <div>
        <input type="text" th:field="*{fullName}" placeholder="Full name">
        <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>
    <div>
        <input type="email" th:field="*{email}" placeholder="Email">
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>
    <div>
        <input type="text" th:field="*{phone}" placeholder="Phone (10 digits)">
        <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
    </div>
    <div>
        <input type="text" th:field="*{department}" placeholder="Department">
        <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
    </div>
    <div>
        <input type="number" step="0.01" th:field="*{salary}" placeholder="Salary">
        <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
    </div>
    <button type="submit">Save Employee</button>
</form>

<hr>
<h3>Employees (<span th:text="${#lists.size(employees)}">0</span>)</h3>
<table>
    <thead>
    <tr>
        <th>ID</th><th>Full Name</th><th>Email</th><th>Phone</th>
        <th>Department</th><th>Salary</th><th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="e : ${employees}">
        <td th:text="${e.id}"></td>
        <td th:text="${e.fullName}"></td>
        <td th:text="${e.email}"></td>
        <td th:text="${e.phone}"></td>
        <td th:text="${e.department}"></td>
        <td th:text="${e.salary}"></td>
        <td>
            <a th:href="@{/employees/{id}/edit(id=${e.id})}">Edit</a>
            <form th:action="@{/employees/{id}/delete(id=${e.id})}" method="post" style="display:inline"
                  onsubmit="return confirm('Delete this employee?');">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(employees)}">
        <td colspan="7">No employees yet.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
